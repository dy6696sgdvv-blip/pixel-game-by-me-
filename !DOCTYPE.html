<html>
<head>
    <title>Pixel Collector Made BY Dhairya Yadav</title>
    <style>
        body {
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 4px solid white;
            image-rendering: pixelated;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Pixel Collector BY Dhairya Yadav</h1>
<p>Move with WASD or Arrow Keys</p>
<p>Score: <span id="score">0</span></p>

<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {
    x: 180,
    y: 180,
    size: 20,
    speed: 5
};

let score = 0;

const food = {
    x: Math.random() * 380,
    y: Math.random() * 380,
    size: 15
};

const keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function update() {

    if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
    if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;
    if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
    if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    if (
        player.x < food.x + food.size &&
        player.x + player.size > food.x &&
        player.y < food.y + food.size &&
        player.y + player.size > food.y
    ) {
        score++;
        document.getElementById("score").textContent = score;

        food.x = Math.random() * (canvas.width - food.size);
        food.y = Math.random() * (canvas.height - food.size);
    }
}

function draw() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "blue";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, food.size, food.size);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
